services:
  - type: web
    name: spinomok-farmops
    runtime: php
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      npm ci
      npm run build
      php artisan storage:link || true
      php artisan migrate --force
      php artisan db:seed --class=ProductionSeeder --force
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan event:cache
    startCommand: php -S 0.0.0.0:$PORT -t public public/index.php
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SpinoMok FarmOps
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://spinomok.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: spinomok-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: spinomok-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: spinomok-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: spinomok-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: spinomok-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: FILESYSTEM_DISK
        value: local
      - key: BROADCAST_CONNECTION
        value: log

databases:
  - name: spinomok-db
    plan: free
    databaseName: spinomok
    user: spinomok
    region: oregon
